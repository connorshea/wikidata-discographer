# Toolforge Jobs manifest. Load with:  toolforge jobs load jobs.yaml
#
# `image` must be this tool's Build Service image; after a `toolforge build`,
# `toolforge images` shows it. Rename `tool-discographer` if the tool is named
# differently.
#
# Commands call `node` directly rather than `npm run job:*`: the launch image
# has npm but not pnpm, and npm refuses to run scripts when package.json's
# devEngines.packageManager names pnpm.

- name: prune-sessions
  command: node jobs/prune-sessions.ts
  image: tool-discographer/tool-discographer:latest
  schedule: "45 2 * * *" # nightly 02:45 UTC
  emails: onfailure

# Refresh the music mirror from the weekly Wikidata JSON dump, which lands on
# Tuesdays. The dump is only visible with `mount: all`. One process reads the
# whole file (no sharding): two CPUs let the gunzip and the line scan run side
# by side. It holds only one batch of rows at a time, so a small heap is
# plenty. Retry once so a run killed by a node drain restarts; the import is
# idempotent, and the prune refuses to delete more than 20% of the mirror.
- name: import-dump
  command: node --max-old-space-size=384 jobs/import-dump.ts
  image: tool-discographer/tool-discographer:latest
  schedule: "0 6 * * 3" # Wednesdays 06:00 UTC
  mount: all
  mem: 512Mi
  cpu: 2
  retry: 1
  timeout: 28800 # 8 h
  emails: onfailure
