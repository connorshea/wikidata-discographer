<!-- The link preview image (public/og-image.png): the header's record and wordmark,
     on the light theme's colours. Crawlers don't render SVG, so regenerate the PNG
     after changing this:
     rsvg-convert -w 1200 -h 630 scripts/og-image.svg -o public/og-image.png -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5a5f78" offset="0" />
      <stop stop-color="#15171f" offset="0.45" />
      <stop stop-color="#15171f" offset="0.55" />
      <stop stop-color="#464a60" offset="1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#f3f4f8" />
  <rect y="606" width="1200" height="24" fill="#2f43c9" />
  <!-- The record, at 28 to 240 px. -->
  <g transform="translate(130 195) scale(8.5714)">
    <circle cx="14" cy="14" r="13" fill="url(#sheen)" stroke="#d7dae4" stroke-width="0.25" />
    <circle cx="14" cy="14" r="8.5" fill="none" stroke="#3a3e4c" stroke-width="0.15" />
    <circle cx="14" cy="14" r="4.5" fill="#2f43c9" />
    <circle cx="14" cy="14" r="1.4" fill="#f3f4f8" />
  </g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="420" y="300" font-size="96" font-weight="bold" letter-spacing="-1" fill="#181a26">Discographer</text>
    <text x="424" y="364" font-size="44" fill="#5a5f74">for Wikidata</text>
    <text x="424" y="446" font-size="28" fill="#5a5f74">Albums, tracks, compositions and singles</text>
    <text x="424" y="484" font-size="28" fill="#5a5f74">from a tracklist.</text>
  </g>
</svg>
